# -*- coding: utf-8 -*-
# CogniFlow CI (ENG-P1-1, 2026-09-11)
# 最小 CI 兜底: 后端 pytest + 前端 lint/type-check.
# 测试基线: 311 passed, 1 pre-existing failed (CLAUDE.md §5).

name: CI

on:
  push:
    branches: [master, develop, feature/**]
  pull_request:
    branches: [master, develop]

# 取消相同 ref 上之前未完成的运行, 节省 CI 分钟.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================================
  # 后端: pytest + 覆盖率
  # ========================================================================
  backend-tests:
    name: Backend tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # 装 pytest 系 (apt 缓存) + 项目依赖.
        # 跳过 torch/ultralytics 等大体积包 (测试不直接用到, 节省 CI 时间).
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov
          # 项目依赖: 排除 torch/ultralytics/torchvision (ci-requirements.txt)
          grep -v -E "^(torch|torchvision|ultralytics)" requirements.txt > /tmp/ci-requirements.txt || true
          python -m pip install -r /tmp/ci-requirements.txt
          # cv2 是 pre-existing failure 的触发依赖, 必须装, 否则整个 suite collection 失败
          python -m pip install opencv-python-headless

      - name: Initialize database (apply schema_version migration)
        # init_db() 内部调用 ensure_rule_graph_schema_column(), 幂等补列.
        run: |
          PYTHONPATH=. python -c "from backend.database import init_db; init_db(); print('init_db OK')"

      - name: Run tests with coverage
        # 退出码 0/1 都允许: pytest 返回 1 时有 1 pre-existing failure (test_fallback_when_cv2_missing).
        # 用 `|| true` 保留 coverage 报告; 真实失败将由 grep 步骤检测.
        run: |
          PYTHONPATH=. python -m pytest \
            --cov=backend/services/rule_engine \
            --cov-report=xml \
            --cov-report=term \
            -v 2>&1 | tee /tmp/pytest.log
          echo "Exit code: $?"

      - name: Detect new failures
        # 用 pytest summary 行判断: 必须是 "X failed" 且 X <= 1 (允许 pre-existing).
        run: |
          FAILED_COUNT=$(grep -oP '(\d+) failed' /tmp/pytest.log | head -1 | grep -oP '\d+' || echo "0")
          PASSED_COUNT=$(grep -oP '(\d+) passed' /tmp/pytest.log | head -1 | grep -oP '\d+' || echo "0")
          echo "Passed: $PASSED_COUNT, Failed: $FAILED_COUNT"
          if [ "$FAILED_COUNT" -gt 1 ]; then
            echo "::error::检测到 $FAILED_COUNT 个失败, 超过允许的 1 个 pre-existing failure"
            exit 1
          fi
          if [ "$PASSED_COUNT" -lt 300 ]; then
            echo "::error::通过数 ($PASSED_COUNT) 低于基线 300, 可能测试套件不完整"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          # 缺 token 时静默跳过, 避免初次集成失败

  # ========================================================================
  # 前端: lint + type-check
  # ========================================================================
  frontend-checks:
    name: Frontend lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # --frozen-lockfile 防止 lockfile 漂移; 锁文件缺失则失败

      - name: Lint
        # 不强制 0 error: 项目历史遗留 warning 较多; 只检测新增 error.
        run: |
          pnpm lint 2>&1 | tee /tmp/lint.log
          NEW_ERRORS=$(grep -E "error" /tmp/lint.log | grep -v "warning" | wc -l)
          if [ "$NEW_ERRORS" -gt 0 ]; then
            echo "::error::检测到 $NEW_ERRORS 个 lint error"
            grep "error" /tmp/lint.log | head -20
            exit 1
          fi

      - name: Type check
        # build:type = vue-tsc --noEmit, 严格模式. 必须 0 error.
        run: pnpm build:type
