# CogniFlow Docker Compose 配置
# 用法:
#   docker compose up          # 前台启动
#   docker compose up -d       # 后台启动
#   docker compose down        # 停止并删除容器
#   docker compose up -d --build  # 重新构建并启动

services:
  # ========== 主服务（后端 + 前端）==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: ${TARGET:-cpu}          # cpu 或 gpu
        PYTHON_VERSION: "3.10"
    container_name: cogniflow-app
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=1
      - DATA_DIR=/app/data
    volumes:
      # 统一数据卷（所有持久化数据）
      - cogniflow-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========== GPU 加速版本（需要 NVIDIA Docker）==========
  app-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: gpu
        PYTHON_VERSION: "3.10"
    container_name: cogniflow-app-gpu
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data
    volumes:
      - cogniflow-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu  # 需要手动: docker compose --profile gpu up

  # ========== 开发模式（挂载源码，热重载）==========
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cogniflow-app-dev
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - DEV_MODE=true
      - DATA_DIR=/app/data
    volumes:
      # 源码挂载（开发时实时修改）
      - ./backend:/app/backend
      - ./engine:/app/engine
      - ./webui:/app/webui
      # 数据目录（持久化）
      - cogniflow-data:/app/data
    profiles:
      - dev  # 需要手动: docker compose --profile dev up

# ========== 数据卷 ==========
volumes:
  cogniflow-data:
    driver: local
