# CogniFlow Docker Compose 配置
# 用法:
#   docker compose up          # 前台启动
#   docker compose up -d       # 后台启动
#   docker compose down        # 停止并删除容器
#   docker compose up -d --build  # 重新构建并启动

services:
  # ========== 主服务（后端 + 前端）==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: ${TARGET:-cpu}          # cpu 或 gpu
        PYTHON_VERSION: "3.10"
    container_name: cogniflow-app
    restart: unless-stopped
    ports:
      - "8000:8000"    # 后端 API
      - "5173:5173"    # 前端开发服务器（仅开发模式）
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=1
    volumes:
      # 挂载上传目录（持久化用户数据）
      - cogniflow-uploads:/app/uploads
      # 挂载检查点目录（持久化模型权重）
      - cogniflow-checkpoints:/app/checkpoints
      # 挂载日志目录
      - cogniflow-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========== GPU 加速版本（需要 NVIDIA Docker）==========
  app-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: gpu
        PYTHON_VERSION: "3.10"
    container_name: cogniflow-app-gpu
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - cogniflow-uploads:/app/uploads
      - cogniflow-checkpoints:/app/checkpoints
      - cogniflow-logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu  # 需要手动: docker compose --profile gpu up

  # ========== 开发模式（挂载源码，热重载）==========
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cogniflow-app-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - DEV_MODE=true
    volumes:
      - ./backend:/app/backend
      - ./engine:/app/engine
      - ./webui:/app/webui
      - ./uploads:/app/uploads
      - cogniflow-checkpoints:/app/checkpoints
      - cogniflow-logs:/app/logs
    profiles:
      - dev  # 需要手动: docker compose --profile dev up

# ========== 数据卷 ==========
volumes:
  cogniflow-uploads:
    driver: local
  cogniflow-checkpoints:
    driver: local
  cogniflow-logs:
    driver: local
