# CogniFlow

data_input:
  capture_fps: 30
  buffer_size: 100
  screenshot_format: png
  video_decoder: ffmpeg

vision:
  image_size: [224, 224]
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  backbone: resnet18
  feature_dim: 512
  use_pretrained: true

rl:
  algorithm: ppo
  gamma: 0.99
  lam: 0.95
  learning_rate: 0.0003
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64
  buffer_size: 2048
  sac_alpha: 0.2

control:
  action_delay: 0.1
  key_press_duration: 0.05
  mouse_move_duration: 0.1
  safety_check: true
  emergency_stop_key: f12

annotation:
  label_format: coco
  export_dir: ./datasets
  auto_save: true
  auto_save_interval: 60

storage:
  root_dir: ./data
  db_type: sqlite
  db_path: ./data/engine.db
  max_storage_gb: 100

training:
  total_timesteps: 1000000
  eval_freq: 10000
  save_freq: 50000
  log_freq: 1000
  num_eval_episodes: 10
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  device: cuda
  distributed: false
  world_size: 1
