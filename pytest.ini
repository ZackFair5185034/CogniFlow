# -*- coding: utf-8 -*-
# CogniFlow pytest 配置 (ENG-P1-3, 2026-09-11)
# 运行方式: PYTHONPATH=. .venv/bin/python -m pytest
[pytest]
# 测试发现目录: 规则引擎主测试套件 + 根级工具测试
testpaths =
    backend/tests
    tests
# 根级 tests/test_api/ 已废弃 (CLAUDE.md §5), 不再收集
# (--ignore 在 addopts 中设置, 见下方)
# 文件/类/函数命名约定
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# pytest-asyncio: 强制每个测试显式标注
asyncio_mode = strict
# 默认输出: 详细模式 + 短 traceback + 严格标记
# --import-mode=importlib 避免 backend/ 在 sys.path[0] 时
# backend/tests/test_rule_engine/ 与 tests/test_rule_engine/ 同名冲突
addopts = -v --tb=short --strict-markers --import-mode=importlib --ignore=tests/test_api
# 覆盖率配置
[coverage:run]
source = backend/services/rule_engine
omit =
    backend/services/rule_engine/migrations.py
    backend/services/rule_engine/nodes/triggers.py
    backend/services/rule_engine/nodes/actions.py
[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = true
precision = 1
fail_under = 60
