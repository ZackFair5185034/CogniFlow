<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- C 形渐变：紫色系 -->
    <linearGradient id="cGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- F 形渐变：青蓝色系 -->
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- C 形 -->
  <path d="M 10 6 A 10 10 0 1 0 10 26"
        fill="none"
        stroke="url(#cGradient)"
        stroke-width="3"
        stroke-linecap="round"/>
  <!-- F 形 -->
  <path d="M 22 6 L 22 8 L 14 8 L 14 14 L 20 14 L 20 16 L 14 16 L 14 26 L 22 26"
        fill="none"
        stroke="url(#fGradient)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- 中心节点 -->
  <circle cx="16" cy="16" r="2.5" fill="#8B5CF6"/>
</svg>