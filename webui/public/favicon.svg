<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 背景圆形 - 深色底 -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e"/>

  <!-- 外圈 - 科技感边框 -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- 眼睛轮廓 -->
  <path d="M5 16 C5 16 9 8 16 8 C23 8 27 16 27 16 C27 16 23 24 16 24 C9 24 5 16 5 16Z"
        fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 眼球内部 -->
  <circle cx="16" cy="16" r="6" fill="#00d4ff" fill-opacity="0.15"/>

  <!-- 瞳孔/靶心 - 核心视觉元素 -->
  <circle cx="16" cy="16" r="4" fill="#00d4ff"/>

  <!-- 瞳孔高光 -->
  <circle cx="17.5" cy="14.5" r="1.2" fill="#ffffff" fill-opacity="0.9"/>

  <!-- 游戏控制器元素 - 左侧按键位 -->
  <circle cx="12" cy="16" r="0.8" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="14" cy="16" r="0.8" fill="#ffffff" fill-opacity="0.7"/>

  <!-- 游戏控制器元素 - 右侧按键位 -->
  <circle cx="18" cy="15" r="0.6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="19.5" cy="16" r="0.6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="18" cy="17" r="0.6" fill="#ffffff" fill-opacity="0.7"/>

  <!-- 扫描线效果 - 顶部 -->
  <line x1="8" y1="10" x2="12" y2="10" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- 扫描线效果 - 底部 -->
  <line x1="20" y1="22" x2="24" y2="22" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
