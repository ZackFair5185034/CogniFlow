<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>

  <!-- 外层圆环 -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#cg)" stroke-width="1.5" opacity="0.5"/>

  <!-- 左半圆 - 青色 -->
  <path d="M 16 6 A 10 10 0 0 0 16 26"
        fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 右半圆 - 品红色 -->
  <path d="M 16 6 A 10 10 0 0 1 16 26"
        fill="none" stroke="#ff00aa" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 中心椭圆 -->
  <ellipse cx="16" cy="16" rx="4" ry="10" fill="url(#cg)"/>

  <!-- 中心亮点 -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1" fill="#00f0ff"/>
</svg>