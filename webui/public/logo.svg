<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- CogniFlow Logo — 视觉感知 / 镜头意象
       单色蓝色，专业工程风格 -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a9ff"/>
      <stop offset="100%" stop-color="#5898ff"/>
    </linearGradient>
  </defs>

  <!-- 外环（镜头光圈） -->
  <circle cx="128" cy="128" r="108"
          fill="none"
          stroke="#2a2a3e"
          stroke-width="4"/>

  <!-- 内环 -->
  <circle cx="128" cy="128" r="96"
          fill="none"
          stroke="#2a2a3e"
          stroke-width="2"/>

  <!-- 镜头主体 -->
  <circle cx="128" cy="128" r="80"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="6"/>

  <!-- 镜头中心（瞳孔） -->
  <circle cx="128" cy="128" r="24"
          fill="url(#accentGrad)"
          opacity="0.9"/>

  <!-- 中心高光 -->
  <circle cx="128" cy="128" r="8"
          fill="#ffffff"
          opacity="0.8"/>

  <!-- 光圈叶片（6片） -->
  <g stroke="url(#accentGrad)" stroke-width="3" opacity="0.3" stroke-linecap="round">
    <line x1="128" y1="48" x2="128" y2="80"/>
    <line x1="128" y1="176" x2="128" y2="208"/>
    <line x1="48" y1="128" x2="80" y2="128"/>
    <line x1="176" y1="128" x2="208" y2="128"/>
    <line x1="71" y1="71" x2="94" y2="94"/>
    <line x1="162" y1="162" x2="185" y2="185"/>
    <line x1="71" y1="185" x2="94" y2="162"/>
    <line x1="162" y1="94" x2="185" y2="71"/>
  </g>
</svg>
