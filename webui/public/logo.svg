<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 紫蓝对角渐变：左下紫到右上蓝 -->
    <linearGradient id="cfGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- C 形（左侧半圆环） -->
  <path d="M 80 48
           A 80 80 0 1 0 80 208"
        fill="none"
        stroke="url(#cfGradient)"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- F 形（右侧方形框架） -->
  <path d="M 176 48
           L 176 64
           L 112 64
           L 112 112
           L 160 112
           L 160 128
           L 112 128
           L 112 192
           L 176 192"
        fill="none"
        stroke="url(#cfGradient)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 连接节点（中心交叠处） -->
  <circle cx="128" cy="128" r="12" fill="#00D4FF"/>
  <circle cx="108" cy="108" r="8" fill="#8B5CF6"/>
  <circle cx="148" cy="148" r="8" fill="#00D4FF"/>
</svg>