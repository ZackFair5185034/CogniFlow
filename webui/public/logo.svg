<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 核心渐变：青色到品红色 -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>

  <!-- 外层圆环 -->
  <circle cx="128" cy="128" r="100"
          fill="none"
          stroke="url(#coreGrad)"
          stroke-width="6"
          stroke-opacity="0.4"/>

  <!-- 内层圆环 -->
  <circle cx="128" cy="128" r="75"
          fill="none"
          stroke="url(#coreGrad)"
          stroke-width="4"
          stroke-opacity="0.6"/>

  <!-- 左半圆 - 青色 -->
  <path d="M 128 53
           A 75 75 0 0 0 128 203"
        fill="none"
        stroke="#00f0ff"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- 右半圆 - 品红色 -->
  <path d="M 128 53
           A 75 75 0 0 1 128 203"
        fill="none"
        stroke="#ff00aa"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- 中心椭圆 -->
  <ellipse cx="128" cy="128" rx="20" ry="50"
           fill="url(#coreGrad)"
           opacity="0.9"/>

  <!-- 中心亮点 -->
  <circle cx="128" cy="128" r="10" fill="#ffffff"/>
  <circle cx="128" cy="128" r="5" fill="#00f0ff"/>

  <!-- 四角装饰 -->
  <circle cx="50" cy="50" r="8" fill="#00f0ff" opacity="0.5"/>
  <circle cx="206" cy="50" r="8" fill="#ff00aa" opacity="0.5"/>
  <circle cx="50" cy="206" r="8" fill="#ff00aa" opacity="0.5"/>
  <circle cx="206" cy="206" r="8" fill="#00f0ff" opacity="0.5"/>
</svg>