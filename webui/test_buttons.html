<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #15151f;
  --border-color: #2a2a3a;
  --text-primary: #e0e0e8;
  --text-secondary: #8888a0;
  --accent-cyan: #00f0ff;
  --accent-magenta: #ff00aa;
  --accent-green: #00ff88;
}

body { background: var(--bg-primary); padding: 40px; font-family: sans-serif; }

.btn-group { display: flex; gap: 16px; margin-bottom: 30px; align-items: center; }
.btn-group span { color: var(--text-muted); font-size: 12px; width: 120px; }

/* Current style - too plain */
.btn-ugly {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}

/* Better cyberpunk style */
.btn-cool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 18px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.btn-cool::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
  opacity: 0;
  transition: opacity 0.2s ease;
}

.btn-cool:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
}

.btn-cool svg { width: 15px; height: 15px; flex-shrink: 0; }

/* Neon glow buttons */
.btn-neon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 20px;
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 4px;
  background: rgba(0, 240, 255, 0.05);
  color: var(--accent-cyan);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.5px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.25s ease;
  text-transform: uppercase;
}

.btn-neon:hover {
  background: rgba(0, 240, 255, 0.1);
  border-color: var(--accent-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), 0 0 30px rgba(0, 240, 255, 0.1);
  transform: translateY(-1px);
}

.btn-neon.delete {
  border-color: rgba(255, 68, 102, 0.3);
  background: rgba(255, 68, 102, 0.05);
  color: #ff4466;
}

.btn-neon.delete:hover {
  background: rgba(255, 68, 102, 0.1);
  border-color: #ff4466;
  box-shadow: 0 0 15px rgba(255, 68, 102, 0.3), 0 0 30px rgba(255, 68, 102, 0.1);
}

.btn-neon svg { width: 14px; height: 14px; flex-shrink: 0; }
</style>
</head>
<body>
  <h3 style="color: var(--text-primary); margin-bottom: 30px;">Button Style Comparison</h3>
  
  <div class="btn-group">
    <span>当前样式 (ugly):</span>
    <button class="btn-ugly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/></svg>
      查看
    </button>
    <button class="btn-ugly" style="border-color: rgba(255,68,102,0.4); color: #ff4466;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      删除
    </button>
  </div>

  <div class="btn-group">
    <span>Cyberpunk 风格:</span>
    <button class="btn-cool">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/></svg>
      查看
    </button>
    <button class="btn-cool" style="--accent-cyan: #ff4466;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      删除
    </button>
  </div>

  <div class="btn-group">
    <span>Neon 风格:</span>
    <button class="btn-neon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/></svg>
      查看
    </button>
    <button class="btn-neon delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      删除
    </button>
  </div>
</body>
</html>
